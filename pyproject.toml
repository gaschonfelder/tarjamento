[project]
name = "redator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gaschonfelder", email = "gaschonfelder@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
redator = "redator:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.mypy]
# pytesseract nao publica stubs nem py.typed; o override evita silenciar o
# resto do projeto com ignore_missing_imports global.
[[tool.mypy.overrides]]
module = "pytesseract"
ignore_missing_imports = true
